[project]
name = "chaain"
version = "0.1.0"
description = "Order gate and warehouse push: demo rebuild of a stock-to-EDI integration"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
chaain = ["workflows/order_push/prompts/*.md"]
