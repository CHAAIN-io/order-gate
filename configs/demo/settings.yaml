# Runtime settings for the demo client profile.
# Gate rules live in rules.yaml (Stage 2.1).

warehouse:
  # Codes the warehouse issues to this client. Placeholders in the demo.
  account_code: DEMO
  site_code: SITE
  # How long to wait. A timeout means "we stopped waiting", not "it failed":
  # the order goes to CHECK, never straight back out.
  connect_timeout_seconds: 10
  response_timeout_seconds: 60
  # Whether the warehouse can be asked "do you have this doc ref?". Unknown for
  # the real one, so off: a person checks instead.
  lookup_enabled: false
  delivery:
    default_earliest: "08:00"
    default_latest: "17:00"
    min_window_minutes: 120    # warehouse needs at least 2 hours
    instructions_max_chars: 120
    booking_required: false    # true puts every order on hold at the warehouse

scheduler:
  timezone: Europe/London
  # Polling windows in local time, start and end included. Where windows
  # overlap, the first listed wins. Outside every window, no polling.
  windows:
    - {start: "11:00", end: "13:30", every_minutes: 5}    # run-up to the 12:30 cut-off
    - {start: "08:00", end: "20:00", every_minutes: 15}
  lookback_hours: 48           # sales changed in this window are looked at
  max_invoice_age_days: 7      # older invoices are ignored, even if changed recently
  per_run_cap: 10              # applied AFTER dedup, so sent orders can't use it up

llm:
  # The notes reader's model. The API key is read by the SDK from the
  # environment (ANTHROPIC_API_KEY in .env); it never appears in config.
  provider: anthropic
  model_env: ANTHROPIC_MODEL          # set this in .env to override the default
  default_model: claude-opus-5-5
  effort: low                         # a short classification: low effort is enough
  max_tokens: 4000
  timeout_seconds: 30
  refusal_fallback: true              # re-run server-side if the model declines
  retry_pause_seconds: 2              # one retry after this pause, then HOLD

queue:
  # Customers are told 12:30; the warehouse really accepts until 13:00. The
  # queue counts down to 12:30 and, between the two, says the warehouse
  # still accepts, so the team can choose whether to push one through late.
  customer_cutoff: "12:30"
  warehouse_cutoff: "13:00"

resolver:
  # Runs every N minutes, all day, every day, apart from the polling windows,
  # so a stuck order is found even when no new orders arrive (the live
  # system's stale check only ran when there were recent orders).
  every_minutes: 15
  stale_pending_minutes: 30   # claimed this long ago with no outcome: ask
  # Alerts go once per item. Future (Stage 3.1 D4, option C): remind if an
  # item is still unanswered after a few hours.
